<style>:root {
  --bg: #0e0f11; --surface: #16181b; --surface2: #1d2024; --line: #2a2d33; --text: #f2f0ea; --muted: #9a9ea6;
  --accent: #ff6a13; --accent-ink: #160800; --good: #3ddc84; --warn: #ffb020; --bad: #ff4d4f; --info: #6aa8ff;
  --r: 14px; --display: 'Saira Condensed', 'Arial Narrow', sans-serif; --body: 'Archivo', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
/* Quiet Mode: neutral, unbranded, looks like a utility app */
body.quiet { --bg: #f4f4f2; --surface: #fff; --surface2: #f0f0ee; --line: #e2e2df; --text: #222; --muted: #6f6f6c; --accent: #3d6f8f; --accent-ink: #fff; --good: #2e8b57; color-scheme: light; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
h1, h2, h3 { margin: 0 0 .4em; line-height: 1.08; }
p { margin: 0 0 1em; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---------- Top + tabs */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.logo { display: flex; text-decoration: none; }
.wordmark { height: 22px; width: auto; fill: var(--text); }
.wordmark .dot { fill: var(--accent); }
.qlogo { font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.qlogo.big { font-size: 34px; margin-bottom: 24px; }
.top-right, .top-links { display: flex; align-items: center; gap: 14px; }
.top-links a { text-decoration: none; color: var(--muted); font-size: 14px; }
.top-links a:hover { color: var(--text); }
.pts { font: 700 13px var(--mono); color: var(--accent); }
.iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; }
.partner-strip { text-align: center; font-size: 13px; padding: 6px; background: var(--surface2); color: var(--muted); border-bottom: 1px solid var(--line); }
.partner-strip b { color: var(--text); }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 120px; }
main.wide { max-width: 1280px; }
.narrow { max-width: 560px; margin: 0 auto; }
.boot { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }

.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-around; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 4px max(8px, env(safe-area-inset-bottom)); }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.tabs a.on { color: var(--accent); }

/* ---------- Type */
.eyebrow { font: 700 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.h2 { font: 800 clamp(32px, 7vw, 44px)/1 var(--display); text-transform: uppercase; letter-spacing: .005em; }
.sec { font: 800 28px/1 var(--display); text-transform: uppercase; margin: 8px 0 18px; }
.muted { color: var(--muted); }
.fine { font-size: 13px; color: var(--muted); }
.lede { font-size: 18px; color: var(--muted); max-width: 560px; }
.lede-sm { font-size: 17px; }
.center { text-align: center; }
.mono { font-family: var(--mono); font-size: .92em; }
.err { color: var(--bad); }
body.quiet .h2, body.quiet .sec { font-family: var(--body); text-transform: none; font-weight: 700; letter-spacing: -.01em; }

/* ---------- Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; padding: 11px 20px; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; transition: transform .08s, background .15s, border-color .15s; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover { border-color: var(--muted); }
.btn.danger { background: transparent; border-color: color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); }
.btn.big { padding: 15px 26px; font-size: 16px; }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn.full { width: 100%; }
.row { display: flex; align-items: center; }
.row.gap { gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; gap: 10px; }
.row.center { justify-content: center; }
.center-v { align-items: center; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 14px; }

/* ---------- Landing */
.hero { display: grid; gap: 8px; padding: 28px 0 40px; position: relative; }
.hero h1 { font: 800 clamp(52px, 12vw, 104px)/.9 var(--display); text-transform: uppercase; margin: 0 0 14px; letter-spacing: -.005em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .row { margin: 14px 0 8px; }
.hero-gauge { max-width: 300px; margin-top: 18px; }
@media (min-width: 900px) { .hero { grid-template-columns: 1.3fr .7fr; align-items: center; column-gap: 40px; } .hero > :not(.hero-gauge) { grid-column: 1; } .hero-gauge { grid-column: 2; grid-row: 1 / span 5; max-width: 380px; justify-self: end; width: 100%; } }
.doors { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 48px; }
.doors.stack { grid-template-columns: 1fr; }
.door { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 20px 52px 20px 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-decoration: none; transition: border-color .15s, transform .1s; }
.door:hover { border-color: var(--accent); transform: translateY(-1px); }
.door .ic { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--accent); }
.door-label { font: 700 24px/1.05 var(--display); text-transform: uppercase; }
.door-blurb { color: var(--muted); font-size: 14px; }
.door.launch::after { content: 'Most popular'; position: absolute; top: 10px; right: 14px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.door.launch .ic { top: 62%; }
.grid3 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-bottom: 40px; }
.feature { padding: 22px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.feature .ic { color: var(--accent); width: 26px; height: 26px; margin-bottom: 10px; }
.feature h3 { font: 700 22px var(--display); text-transform: uppercase; }
.feature p { color: var(--muted); margin: 0 0 .5em; }
.cta-band { text-align: center; padding: 48px 20px; border-radius: 22px; background: radial-gradient(120% 140% at 50% 0%, color-mix(in srgb, var(--accent) 22%, var(--surface)), var(--surface)); border: 1px solid var(--line); margin-bottom: 40px; }
.cta-band h2 { font: 800 clamp(28px, 5vw, 42px)/1.02 var(--display); text-transform: uppercase; max-width: 760px; margin: 0 auto 22px; }
.foot { border-top: 1px solid var(--line); padding-top: 22px; font-size: 13px; color: var(--muted); }
.foot a { color: var(--muted); }

/* ---------- Forms */
.form { display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; flex: 1; }
input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); font-weight: 400; font-size: 16px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
fieldset.flags { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; margin: 0; }
fieldset legend { font-weight: 700; padding: 0 6px; font-size: 14px; }
.slider { display: flex; align-items: center; gap: 12px; }
.slider input { flex: 1; accent-color: var(--accent); height: 28px; }
.slider output { font: 700 22px var(--mono); min-width: 32px; text-align: right; color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg label { display: block; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; text-align: center; padding: 11px 6px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 14px; }
.seg input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); }
.toggle { align-items: center; }

/* ---------- Cards / lists */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 14px; }
.card h3 { font-size: 17px; }
.card.left { text-align: left; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag .ic { width: 12px; height: 12px; }
.tag.cam { color: var(--accent); }
.list { padding-left: 20px; margin: 0 0 1em; }
.list li { margin: 4px 0; }
.list.checks { list-style: none; padding: 0; }
.list.checks li { padding-left: 24px; position: relative; }
.list.checks li::before { content: ''; position: absolute; left: 2px; top: 8px; width: 10px; height: 6px; border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg); }
.opts { display: grid; gap: 10px; margin: 16px 0; }
.opt { display: grid; gap: 2px; text-align: left; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-decoration: none; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt span { color: var(--muted); font-size: 14px; }
.note { display: flex; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--surface2); border: 1px solid var(--line); margin: 14px 0; font-size: 14px; }
.note .ic { color: var(--accent); margin-top: 2px; }
.note.warn .ic { color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; text-decoration: none; font-size: 14px; }
.banner > div { flex: 1; }
.banner.hot { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.banner.hot > .ic:first-child { color: var(--accent); }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
.banner.warn > .ic:first-child { color: var(--warn); }
.banner.pt > .ic:first-child { color: var(--info); }

/* ---------- Gauge */
.gauge { position: relative; width: 100%; max-width: 320px; margin: 0 auto 14px; text-align: center; }
.gauge svg { width: 100%; display: block; overflow: visible; }
.g-track { fill: none; stroke: var(--line); stroke-width: 12; stroke-linecap: round; }
.g-fill { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 50%, transparent)); animation: fill 1.1s cubic-bezier(.2, .8, .2, 1); }
@keyframes fill { from { stroke-dasharray: 0 100; } }
.g-ticks line { stroke: var(--muted); stroke-width: 1.5; opacity: .5; }
.g-dot { fill: #fff; }
.g-num { font: 800 64px/1 var(--display); margin-top: -64px; letter-spacing: .01em; }
.g-label { font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--muted); margin-top: 4px; }
.g-label .up { color: var(--good); }
.g-label .down { color: var(--bad); }
.g-scale { display: flex; justify-content: space-between; font: 500 11px var(--mono); color: var(--muted); padding: 0 6px; margin-top: -18px; }
.gauge.small { max-width: 200px; margin-bottom: 0; }
.gauge.small .g-num { font-size: 44px; margin-top: -44px; }
.gauge.small .g-scale { display: none; }
body.quiet .g-num { font-family: var(--body); font-weight: 700; }
.delta-line { font-size: 15px; }
.delta-line b { color: var(--good); }
.parts { display: grid; gap: 10px; margin: 22px 0; text-align: left; }
.part { display: grid; grid-template-columns: 90px 1fr 34px; align-items: center; gap: 12px; text-transform: capitalize; font-size: 14px; }
.part b { font-family: var(--mono); text-align: right; }
.bar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.tests-detail { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 18px 0; }
.td { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--surface); font-size: 14px; }
.td b { font-family: var(--mono); }

/* ---------- Score flow */
.tests { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
.tests li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tests .muted { margin-left: auto; font-size: 13px; }
.num { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line); font: 700 13px var(--mono); flex: none; }
#score-root.running { max-width: 1000px; }
.screen-stage { display: grid; gap: 16px; }
@media (min-width: 860px) { .screen-stage { grid-template-columns: 1.6fr 1fr; align-items: start; } }
.cam { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; border: 1px solid var(--line); }
.cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.screen-stage video, .cam video.mirror { transform: scaleX(-1); }
.cam-hud { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; background: linear-gradient(transparent 50%, rgba(0, 0, 0, .7)); color: #fff; pointer-events: none; }
.hud-test { position: absolute; top: 14px; left: 16px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: rgba(0, 0, 0, .5); padding: 5px 10px; border-radius: 99px; }
.hud-big { font: 800 56px/1 var(--display); text-transform: uppercase; }
.hud-sub { font-size: 15px; opacity: .9; margin: 4px 0 10px; }
.hud-bar { height: 5px; background: rgba(255, 255, 255, .2); border-radius: 9px; overflow: hidden; }
.hud-bar i { display: block; height: 100%; background: #ff6a13; transition: width .2s; }
.screen-progress { display: flex; gap: 6px; margin-bottom: 14px; }
.screen-progress span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); font: 700 12px var(--mono); color: var(--muted); }
.screen-progress .on { border-color: var(--accent); color: var(--accent); }
.screen-progress .done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.st-steps { padding-left: 20px; color: var(--muted); }
.form-cam { margin: 14px 0; }

/* ---------- Home */
.hello { margin-bottom: 18px; }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 520px) { .home-grid { grid-template-columns: 1fr; } }
.home-grid .card { margin: 0; display: flex; align-items: center; justify-content: center; text-decoration: none; min-height: 150px; }
.empty-score { display: grid; text-align: center; gap: 4px; }
.empty-score span { color: var(--muted); font-size: 14px; }
.progress-card { gap: 16px; }
.progress-card > div:last-child { display: grid; gap: 2px; }
.ring { --p: 0; width: 96px; height: 96px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: radial-gradient(closest-side, var(--surface) 78%, transparent 79%), conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); flex: none; }
.ring b { font: 800 30px/1 var(--display); }
.ring span { font-size: 11px; color: var(--muted); }
.ex-list { list-style: none; padding: 0; margin: 10px 0 16px; }
.ex-list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; flex-wrap: wrap; }
.ex-list li span:first-child { flex: 1; }
.ex-list .muted { font-family: var(--mono); font-size: 13px; }
.padn { font: 700 28px var(--mono); min-width: 40px; text-align: center; }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 50px; margin-top: 12px; }
.spark i { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.spark.tall { height: 80px; }

/* ---------- Session */
.session { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 12px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; transition: opacity .2s, border-color .2s; }
.ex.done { border-color: color-mix(in srgb, var(--good) 50%, transparent); }
.ex.done .cues, .ex.done .row { display: none; }
.ex-head { display: flex; align-items: center; gap: 12px; }
.ex-head > div { flex: 1; display: grid; }
.ex-head b { font-size: 17px; }
.dose { font-family: var(--mono); font-size: 13px; color: var(--accent); }
.tick { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; color: transparent; flex: none; }
.ex.done .tick { background: var(--good); border-color: var(--good); color: #062; }
.cues { color: var(--muted); font-size: 14px; padding-left: 20px; margin: 10px 0; }
.big-check { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: 20px auto 18px; }
.big-check .ic { width: 42px; height: 42px; stroke-width: 3; }

/* ---------- Program */
.finish { display: grid; gap: 2px; padding: 16px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 12px 12px 0; margin: 16px 0; }
.finish span { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.timeline { display: grid; gap: 10px; margin: 18px 0; }
.phase { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.phase .wk { display: block; font: 700 12px var(--mono); color: var(--accent); }
.phase b { font: 700 20px var(--display); text-transform: uppercase; }
.phase ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; columns: 2; column-gap: 20px; }
body.quiet .phase b { font-family: var(--body); text-transform: none; font-size: 17px; }
.stop { text-align: left; }
.stop-icon .ic { width: 48px; height: 48px; color: var(--warn); }

/* ---------- Coach */
.chat { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100vh - 210px); }
.msgs { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
.msg { display: flex; flex-direction: column; max-width: 86%; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.bubble { padding: 11px 15px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
.msg.me .bubble { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); border-bottom-right-radius: 6px; }
.msg.coach .bubble { border-bottom-left-radius: 6px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.typing .bubble { display: flex; gap: 5px; padding: 15px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.composer { position: sticky; bottom: 76px; display: flex; gap: 8px; padding: 10px 0; background: var(--bg); }
.composer input { flex: 1; border-radius: 999px !important; }
.mic.live { background: var(--bad); border-color: var(--bad); color: #fff; animation: blink 1s infinite; }
#chips { margin-bottom: 4px; }

/* ---------- Squad */
.board { list-style: none; padding: 0; margin: 0; }
.board li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.board li.me { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 10px; padding-left: 10px; }
.board .rank { font: 800 22px var(--display); width: 26px; color: var(--muted); }
.board li:first-child .rank { color: var(--accent); }
.board .who { flex: 1; font-weight: 600; }
.board .stat { font-size: 12px; color: var(--muted); }
.board b { font-family: var(--mono); min-width: 64px; text-align: right; }
.challenge { border-color: var(--accent); }

/* ---------- Plans */
.plans { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin: 26px 0 14px; }
.plan { position: relative; display: flex; flex-direction: column; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.plan.featured { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 20px 50px -20px color-mix(in srgb, var(--accent) 50%, transparent); }
.plan .tag { position: absolute; top: -11px; left: 22px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.plan h3 { font: 700 22px var(--display); text-transform: uppercase; }
.price { font: 800 48px/1 var(--display); margin: 6px 0 10px; }
.price span { font: 500 15px var(--body); color: var(--muted); }
.plan .list { flex: 1; }
.kit { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

/* ---------- PT dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
.kpis.small { grid-template-columns: 1fr 1fr; }
.kpi { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: grid; }
.kpi b { font: 800 34px/1 var(--display); }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi.hot b { color: var(--accent); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 14px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr[data-id] { cursor: pointer; }
.tbl tr[data-id]:hover td { background: var(--surface2); }
.sub { display: block; font-size: 12px; color: var(--muted); }
.alert { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin: 0 4px 4px 0; background: var(--surface2); }
.alert.urgent { background: var(--bad); color: #fff; }
.alert.high { background: color-mix(in srgb, var(--bad) 22%, transparent); color: #ff9a9b; }
.alert.medium { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.alert.info { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
.alerts { margin: 6px 0 14px; }
.pt-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.pt-grid .card { margin-bottom: 0; }
.pt > .card, .pt-grid { margin-bottom: 14px; }
.transcript { max-height: 280px; overflow-y: auto; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; background: var(--surface2); }
.transcript p { margin: 0 0 8px; }

/* ---------- Partners: printable chair card */
.chair-card { width: 100%; max-width: 380px; margin: 0 auto 16px; background: #0e0f11; color: #f2f0ea; border-radius: 20px; padding: 26px; text-align: center; border: 1px solid #2a2d33; }
.cc-top { font: 800 20px 'Saira Condensed', sans-serif; letter-spacing: .12em; }
.cc-top span { color: #ff6a13; }
.cc-head { font: 800 44px/0.95 'Saira Condensed', sans-serif; text-transform: uppercase; margin: 16px 0; }
.cc-head em { font-style: normal; color: #ff6a13; }
.cc-qr { background: #fff; border-radius: 14px; padding: 10px; width: 220px; margin: 0 auto 16px; }
.cc-qr svg { width: 100%; height: auto; display: block; }
.cc-sub { font-weight: 600; font-size: 17px; margin-bottom: 8px; }
.cc-fine { font-size: 12px; color: #9a9ea6; }

/* ---------- Lock + toast */
.lock { min-height: 80vh; display: grid; place-content: center; text-align: center; }
.lock form { display: flex; gap: 10px; }
.lock input { text-align: center; letter-spacing: .5em; font-size: 22px !important; max-width: 160px; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: .25s; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media print {
  body * { visibility: hidden; }
  #print-card, #print-card * { visibility: visible; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-card { position: absolute; left: 50%; top: 20mm; transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.row.wrap > label { min-width: 150px; }
body.quiet .g-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
</style>

<script>window.TUNED_VENDOR = {"bundle":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs","wasmJs":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm/vision_wasm_internal.js","wasmBin":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm/vision_wasm_internal.wasm","model":"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"};</script>
<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
