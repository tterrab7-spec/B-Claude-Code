PUI.api('GET', '/api/shared/' + encodeURIComponent(PUI.qs('t') || '')).then(function (j) {

}).catch(function (e) { document.getElementById('report').innerHTML = '<div class="notice warn"><div>' + PUI.esc(e.message) + '</div></div>'; });
